[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endoscopy-cade-mvp"
version = "0.0.1"
description = "Endoscopic CADe baseline + reproducible eval harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Lucas Dickel Canova, MD", email = "knovihax@gmail.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "pydantic>=2.6",
]

[project.optional-dependencies]
torch = [
    "torch>=2.2",
    "torchvision>=0.17",
]
yolo = [
    "ultralytics>=8.3",
]
medsam = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.45",
]
viz = [
    "matplotlib>=3.8",
    "scikit-image>=0.22",
]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.6",
    "ipykernel>=6",
]

[project.scripts]
cade-eval = "cade.eval.runner:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
